<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业智能客服Agent系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1e293b;
            color: white;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .message {
            max-width: 70%;
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user {
            background: #3b82f6;
            color: white;
            margin-left: auto;
        }
        .assistant {
            background: white;
            color: #333;
            border: 1px solid #e5e7eb;
        }
        .status-list {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #e5e7eb;
        }
        .status-item {
            font-size: 12px;
            color: #888;
            padding: 2px 0;
            line-height: 1.5;
        }
        footer {
            display: flex;
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e5e7eb;
            gap: 12px;
        }
        #query-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        #query-input:focus { border-color: #3b82f6; }
        button {
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        #upload-area {
            padding: 12px 24px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header>🤖 企业智能客服Agent系统</header>

    <div id="upload-area">
        <label>上传知识库 PDF：</label>
        <input type="file" id="pdf-file" accept=".pdf">
        <button onclick="uploadPDF()">上传</button>
        <span id="upload-status" style="color: #666;"></span>
    </div>

    <div id="chat-box"></div>

    <footer>
        <input type="text" id="query-input" placeholder="请输入你的问题..." onkeypress="if(event.key==='Enter') sendQuery()">
        <button id="send-btn" onclick="sendQuery()">发送</button>
    </footer>

    <script>
        const chatBox = document.getElementById('chat-box');
        const queryInput = document.getElementById('query-input');
        const sendBtn = document.getElementById('send-btn');
        const sessionId = "user_" + Math.random().toString(36).substring(2, 10);

        // 上传 PDF
        async function uploadPDF() {
            const fileInput = document.getElementById('pdf-file');
            const status = document.getElementById('upload-status');
            if (!fileInput.files.length) {
                status.textContent = "请先选择 PDF 文件";
                return;
            }
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            status.textContent = "上传中...";
            try {
                const res = await fetch("/upload", { method: "POST", body: formData });
                const data = await res.json();
                status.textContent = "✅ " + data.message;
            } catch (e) {
                status.textContent = "❌ 上传失败：" + e;
            }
        }

        // 添加消息到聊天框
        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        // 发送问题（流式）
        async function sendQuery() {
            const query = queryInput.value.trim();
            if (!query) return;

            addMessage('user', query);
            queryInput.value = "";
            sendBtn.disabled = true;

            // 创建助手气泡（内部包含状态区 + 回答区）
            const assistantDiv = document.createElement('div');
            assistantDiv.className = 'message assistant';

            const statusList = document.createElement('div');
            statusList.className = 'status-list';
            statusList.style.display = 'none';

            const answerDiv = document.createElement('div');

            assistantDiv.appendChild(statusList);
            assistantDiv.appendChild(answerDiv);
            chatBox.appendChild(assistantDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            let fullText = "";

            try {
                const res = await fetch("/ask/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: query, session_id: sessionId })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.slice(6).trim();
                            if (!dataStr) continue;
                            try {
                                const data = JSON.parse(dataStr);

                                // 状态提示
                                if (data.type === "status") {
                                    statusList.style.display = 'block';
                                    const item = document.createElement('div');
                                    item.className = 'status-item';
                                    item.textContent = data.message;
                                    statusList.appendChild(item);
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                                // 回答正文
                                else if (data.type === "content") {
                                    fullText += data.content;
                                    answerDiv.textContent = fullText;
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                                // 兼容旧格式
                                else if (data.content) {
                                    fullText += data.content;
                                    answerDiv.textContent = fullText;
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                            } catch (e) {
                                // 忽略解析失败
                            }
                        }
                    }
                }
            } catch (e) {
                answerDiv.textContent = "❌ 请求失败：" + e;
            }

            sendBtn.disabled = false;
            queryInput.focus();
        }
    </script>
</body>
</html>
